# =============================================================================
# AppGate — Dependency Review Configuration
# =============================================================================
fail-on-severity: high
allow-licenses:
  - Apache-2.0
  - MIT
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - MPL-2.0
  - Unlicense
deny-licenses:
  - GPL-3.0
  - AGPL-3.0
  - BUSL-1.1
  - SSPL-1.0
allow-dependencies-licenses:
  - pkg:cargo/ring
  - pkg:go/github.com/rs/zerolog