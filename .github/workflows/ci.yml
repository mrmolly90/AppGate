name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/environments/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
      - run: terraform fmt -check
      - run: terraform init
      - run: terraform validate
      - uses: tenable/terrascan-action@v2
        with:
          only_warn: true

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: auto

  go:
    name: Go Control Plane
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - run: go build ./cmd/appgate
      - run: go test ./... -race -count=1
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  rust:
    name: Rust Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo build --release
      - run: cargo test
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo fmt --check
      - uses: actions-rust-lang/rust-audit@v1
        with:
          cargo deny: true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Control Plane
        uses: docker/build-push-action@v5
        with:
          context: control-plane
          file: control-plane/Dockerfile
          tags: appgate/control-plane:latest
          load: true
      - name: Build Gateway
        uses: docker/build-push-action@v5
        with:
          context: gateway
          file: gateway/Dockerfile
          tags: appgate/gateway:latest
          load: true
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: appgate/control-plane:latest
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL