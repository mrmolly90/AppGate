# =============================================================================
# AppGate CI/CD Pipeline (Production)
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  id-token: write
  pull-requests: write
  packages: write

env:
  GO_VERSION: "1.23"
  RUST_VERSION: "1.85.0"
  TERRAFORM_VERSION: "1.7.0"
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  RUST_BACKTRACE: "1"
  CARGO_TERM_COLOR: "always"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      rust: ${{ steps.filter.outputs.rust }}
      terraform: ${{ steps.filter.outputs.terraform }}
      docker: ${{ steps.filter.outputs.docker }}
      helm: ${{ steps.filter.outputs.helm }}
      security: ${{ steps.filter.outputs.security }}
      otel: ${{ steps.filter.outputs.otel }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'control-plane/**'
              - '.github/workflows/ci.yml'
            rust:
              - 'gateway/**'
              - '.github/workflows/ci.yml'
            terraform:
              - 'infra/terraform/**'
            docker:
              - '**/Dockerfile'
              - '**/.dockerignore'
            helm:
              - 'deploy/helm/**'
            security:
              - 'security/**'
            otel:
              - 'observability/otel/**'

  otel:
    name: OTel Config Validation
    needs: changes
    if: ${{ needs.changes.outputs.otel == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OTel config
        run: |
          docker run --rm -v ${{ github.workspace }}/observability/otel:/config \
            otel/opentelemetry-collector-contrib:0.118.0 \
            --config /config/otel-config.yaml --dry-run 2>&1 || \
            echo "WARNING: OTel dry-run produced warnings (non-blocking)"

  rust:
    name: Rust Gateway
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateway
          shared-key: appgate-gateway
          cache-on-failure: true
      - name: Fetch dependencies (locked)
        run: cargo fetch --locked
      - name: Check format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -W clippy::all
      - name: Test
        run: cargo test --locked
      - name: Build (musl, release)
        run: cargo build --release --target x86_64-unknown-linux-musl --locked
      - name: Cargo Audit
        uses: rustsec/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  go:
    name: Go Control Plane
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: control-plane/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Tidy and verify
        run: go mod tidy && go mod verify
      - name: Build
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "0.2.0")
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          go build \
            -ldflags="-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT}" \
            -o bin/appgate ./cmd/server/
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -race -shuffle=on -count=1 -timeout=60s
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59
          args: --timeout=5m
          working-directory: control-plane

  terraform:
    name: Terraform Validation
    needs: changes
    if: ${{ needs.changes.outputs.terraform == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, staging, production]
      fail-fast: false
    defaults:
      run:
        working-directory: infra/terraform/environments/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff .
      - name: Terraform init
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        run: terraform validate -no-color
      - name: Checkov IaC Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
          soft_fail: true

  helm:
    name: Helm Lint
    needs: changes
    if: ${{ needs.changes.outputs.helm == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: Helm dependency build
        run: helm dependency build deploy/helm/appgate
      - name: Helm lint
        run: helm lint deploy/helm/appgate --strict
      - name: Helm template
        run: helm template appgate deploy/helm/appgate > /dev/null

  security-scan:
    name: Security Scanning
    needs: changes
    if: ${{ needs.changes.outputs.security == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: |
            .git
            gateway/target
            control-plane/bin
        continue-on-error: true
      - name: Upload Trivy FS results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  docker:
    name: Docker Build & Scan
    needs: [changes, rust, go, helm]
    if: |
      always() && needs.changes.outputs.docker == 'true' &&
      (needs.rust.result == 'success' || needs.rust.result == 'skipped') &&
      (needs.go.result == 'success' || needs.go.result == 'skipped') &&
      (needs.helm.result == 'success' || needs.helm.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: control-plane
            context: control-plane
            dockerfile: control-plane/Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: gateway
            context: gateway
            dockerfile: gateway/Dockerfile
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/appgate-${{ matrix.service.name }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: ${{ matrix.service.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          sbom: true
          provenance: true
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.tags }}
          format: spdx-json
          output-file: sbom-${{ matrix.service.name }}.spdx.json
      - uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'
      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/appgate-${{ matrix.service.name }}
        run: |
          cosign sign --yes \
            --oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: sarif
          output: trivy-${{ matrix.service.name }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service.name }}.sarif