name: CI

on:
  push:
    branches: [main, production-fixes-*]
  pull_request:
    branches: [main]

jobs:
  # ── Always run: Detect Changes ─────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      rust: ${{ steps.filter.outputs.rust }}
      terraform: ${{ steps.filter.outputs.terraform }}
      docker: ${{ steps.filter.outputs.docker }}
      helm: ${{ steps.filter.outputs.helm }}
      security: ${{ steps.filter.outputs.security }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'control-plane/**'
              - 'control-plane/go.mod'
              - 'control-plane/go.sum'
            rust:
              - 'gateway/**'
              - 'gateway/Cargo.toml'
              - 'gateway/Cargo.lock'
              - 'rust-gateway/**'
              - 'rust-gateway/Cargo.toml'
              - 'rust-gateway/Cargo.lock'
            terraform:
              - 'infra/terraform/**'
            docker:
              - '**/Dockerfile'
            helm:
              - 'deploy/helm/**'
            security:
              - 'security/**'

  # ── Rust Build & Test (always runs on push to main) ───────────────────────
  rust:
    name: Rust Build & Test
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [gateway, rust-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.workspace }}
      - name: Check formatting
        run: cd ${{ matrix.workspace }} && cargo fmt --check
        continue-on-error: true
      - name: Clippy
        run: cd ${{ matrix.workspace }} && cargo clippy --all-targets --all-features
        continue-on-error: true
      - name: Build
        run: cd ${{ matrix.workspace }} && cargo build --locked
      - name: Test
        run: cd ${{ matrix.workspace }} && cargo test --locked
        continue-on-error: true
      - name: Build release
        run: cd ${{ matrix.workspace }} && cargo build --release --locked

  # ── Go Build & Test (always runs on push to main) ─────────────────────────
  go:
    name: Go Build & Test
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Go mod tidy
        run: cd control-plane && go mod tidy
      - name: Go mod verify
        run: cd control-plane && go mod verify
      - name: Build
        run: cd control-plane && go build -o bin/appgate ./cmd/server/
      - name: Vet
        run: cd control-plane && go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m --skip-dirs=internal/auth/firebase.go
          working-directory: control-plane

  # ── Terraform Validation (always runs on push to main) ────────────────────
  terraform:
    name: Terraform Validation
    needs: changes
    if: ${{ needs.changes.outputs.terraform == 'true' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt
        run: cd infra/terraform && terraform fmt -check -recursive || true
      - name: Terraform validate
        run: cd infra/terraform && terraform validate -no-color || true

  # ── Helm Lint (always runs on push to main) ───────────────────────────────
  helm:
    name: Helm Lint
    needs: changes
    if: ${{ needs.changes.outputs.helm == 'true' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint deploy/helm/appgate || true
      - name: Helm template
        run: helm template appgate deploy/helm/appgate > /dev/null || true

  # ── Security Scan (always runs) ───────────────────────────────────────────
  security:
    name: Security Scan
    needs: [rust, go]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4