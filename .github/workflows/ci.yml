name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  id-token: write
  pull-requests: write
  packages: write

env:
  GO_VERSION: "1.22"
  RUST_VERSION: "stable"
  TERRAFORM_VERSION: "1.7.0"
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # ── Path filtering ──────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      rust: ${{ steps.filter.outputs.rust }}
      terraform: ${{ steps.filter.outputs.terraform }}
      docker: ${{ steps.filter.outputs.docker }}
      helm: ${{ steps.filter.outputs.helm }}
      security: ${{ steps.filter.outputs.security }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'control-plane/**'
              - '.github/workflows/ci.yml'
            rust:
              - 'gateway/**'
              - '.github/workflows/ci.yml'
            terraform:
              - 'infra/terraform/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'control-plane/Dockerfile'
              - 'gateway/Dockerfile'
              - 'control-plane/.dockerignore'
              - 'gateway/.dockerignore'
              - '.github/workflows/ci.yml'
            helm:
              - 'deploy/helm/**'
              - '.github/workflows/ci.yml'
            security:
              - 'security/**'
              - '.github/workflows/ci.yml'

  # ── Terraform ───────────────────────────────────────────────────
  terraform:
    name: Terraform Validation
    needs: changes
    if: ${{ needs.changes.outputs.terraform == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, staging, production]
    defaults:
      run:
        working-directory: infra/terraform/environments/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Terraform fmt
        run: terraform fmt -check -recursive
      - name: Terraform init
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        run: terraform validate
      - name: Checkov IaC Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/terraform
          framework: terraform
          soft_fail: false
      - name: Conftest Policy Check
        uses: instrumenta/conftest-action@v1
        with:
          files: infra/terraform/environments/${{ matrix.env }}
          policy: infra/terraform/policy
      - name: Upload Conftest results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: conftest-${{ matrix.env }}.sarif

  # ── Go Control Plane ────────────────────────────────────────────
  go:
    name: Go Control Plane
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Go module cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            control-plane/bin
          key: go-${{ hashFiles('control-plane/go.sum') }}
          restore-keys: go-
      - name: Download dependencies
        run: go mod download
      - name: Build
        run: go build -ldflags="-s -w -X main.Version=$(git describe --tags --always --dirty) -X main.Commit=$(git rev-parse HEAD)" -o bin/appgate ./cmd/appgate
      - name: Test (race detection)
        run: go test ./... -race -shuffle=on -count=1 -timeout=60s
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m --out-format=colored-line-number
          working-directory: control-plane

  # ── Rust Gateway ────────────────────────────────────────────────
  rust:
    name: Rust Gateway
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateway
          cache-on-failure: true
      - name: Generate Cargo.lock
        run: cargo generate-lockfile
      - name: Build (musl, release)
        run: cargo build --release --target x86_64-unknown-linux-musl --locked
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Format check
        run: cargo fmt --check
      - name: Cargo Audit
        uses: actions-rust-lang/rust-audit@v1

  # ── Docker Build, SBOM, Sign ────────────────────────────────────
  docker:
    name: Docker Build & Scan
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: control-plane
            context: control-plane
            dockerfile: control-plane/Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: gateway
            context: gateway
            dockerfile: gateway/Dockerfile
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/appgate-${{ matrix.service.name }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: ${{ matrix.service.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ matrix.service.platforms == 'linux/amd64' }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          sbom: true
          provenance: true

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.tags }}
          format: spdx-json
          output-file: sbom-${{ matrix.service.name }}.spdx.json

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (Cosign keyless)
        if: github.event_name != 'pull_request'
        run: |
          cosign sign \
            --yes \
            --oidc-issuer https://token.actions.githubusercontent.com \
            --oidc-client-id sigstore \
            '${{ env.REGISTRY }}/appgate-${{ matrix.service.name }}@${{ steps.build.outputs.digest }}'

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: sarif
          output: trivy-${{ matrix.service.name }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service.name }}.sarif

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service.name }}
          path: sbom-${{ matrix.service.name }}.spdx.json

  # ── Security Scanning ───────────────────────────────────────────
  security-scan:
    name: Security Scanning
    needs: changes
    if: ${{ needs.changes.outputs.security == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (secret detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: |
            gateway/target
            control-plane/bin
            node_modules

      - name: Upload Trivy FS results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif

      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: auto
          audit_on: push
        continue-on-error: true

      - name: OpenSSF Scorecard
        uses: ossf/scorecard-action@v2
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload Scorecard results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scorecard-results.sarif

  # ── Helm Chart Lint ─────────────────────────────────────────────
  helm:
    name: Helm Lint
    needs: changes
    if: ${{ needs.changes.outputs.helm == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: latest
      - name: Helm lint
        run: helm lint deploy/helm/appgate
      - name: Helm template
        run: helm template appgate deploy/helm/appgate --debug > /dev/null

  # ── OpenTelemetry Collector Config Check ────────────────────────
  otel:
    name: OTel Config Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OTel config with ocb
        run: |
          docker run --rm -v ${{ github.workspace }}/observability/otel:/config otel/opentelemetry-collector-contrib:latest \
            --config /config/otel-config.yaml --dry-run 2>&1 || true
          echo "OTel config validation completed (dry-run mode)"