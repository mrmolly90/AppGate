name: Diagnostic Build

on:
  workflow_dispatch:

jobs:
  go-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build control-plane directly
        working-directory: control-plane
        run: |
          echo "=== go.mod ==="
          head -3 go.mod
          echo ""
          echo "=== go mod tidy ==="
          go mod tidy -v
          echo ""
          echo "=== go build ==="
          go build -v -o /tmp/cp-test ./cmd/server
          echo ""
          echo "=== BUILD SUCCESS ==="