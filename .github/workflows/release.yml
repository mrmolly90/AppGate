name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push control-plane
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag ${{ env.REGISTRY }}/appgate-control-plane:${{ github.ref_name }} \
            --tag ${{ env.REGISTRY }}/appgate-control-plane:latest \
            --push \
            control-plane/

      - name: Build and push gateway
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag ${{ env.REGISTRY }}/appgate-gateway:${{ github.ref_name }} \
            --tag ${{ env.REGISTRY }}/appgate-gateway:latest \
            --push \
            gateway/

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign control-plane image
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/appgate-control-plane:${{ github.ref_name }}

      - name: Sign gateway image
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/appgate-gateway:${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            sbom-*.spdx.json