# =============================================================================
# AppGate — Release Pipeline
# =============================================================================
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom-release.spdx.json

      - name: Build and push control-plane
        uses: docker/build-push-action@v6
        with:
          context: control-plane
          file: control-plane/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/appgate-control-plane:${{ github.ref_name }}
            ${{ env.REGISTRY }}/appgate-control-plane:latest
          push: true
          sbom: true
          provenance: true
          cache-from: type=gha,scope=control-plane
          cache-to: type=gha,mode=max,scope=control-plane

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: gateway
          file: gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/appgate-gateway:${{ github.ref_name }}
            ${{ env.REGISTRY }}/appgate-gateway:latest
          push: true
          sbom: true
          provenance: true
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign control-plane image
        env:
          DIGEST: ${{ steps.build-cp.outputs.digest }}
        run: |
          cosign sign --yes \
            --oidc-issuer https://token.actions.githubusercontent.com \
            --oidc-client-id sigstore \
            "${{ env.REGISTRY }}/appgate-control-plane@${{ steps.build-cp.outputs.digest }}"

      - name: Sign gateway image
        env:
          DIGEST: ${{ steps.build-gw.outputs.digest }}
        run: |
          cosign sign --yes \
            --oidc-issuer https://token.actions.githubusercontent.com \
            --oidc-client-id sigstore \
            "${{ env.REGISTRY }}/appgate-gateway@${{ steps.build-gw.outputs.digest }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            sbom-release.spdx.json