name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build control-plane binary
        working-directory: control-plane
        run: |
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../control-plane-binary ./cmd/server

      - name: Build control-plane Docker image (from binary)
        run: |
          cat > Dockerfile.cp << 'EOF'
          FROM gcr.io/distroless/static:nonroot
          COPY control-plane-binary /app/control-plane
          EXPOSE 8080 9090
          ENTRYPOINT ["/app/control-plane"]
          EOF
          docker build -f Dockerfile.cp -t ${{ env.REGISTRY }}/appgate-control-plane:${{ github.ref_name }} .
          docker push ${{ env.REGISTRY }}/appgate-control-plane:${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true