name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: DIAGNOSTIC — Build control-plane (verbose)
        run: |
          echo "=== Dockerfile contents ==="
          cat control-plane/Dockerfile
          echo ""
          echo "=== go.mod first 5 lines ==="
          head -5 control-plane/go.mod
          echo ""
          echo "=== Building control-plane ==="
          docker build --progress=plain --no-cache -t test-cp control-plane/ 2>&1 || echo "BUILD EXIT CODE: $?"

      - name: DIAGNOSTIC — Build gateway (verbose)
        run: |
          echo "=== Dockerfile contents ==="
          cat gateway/Dockerfile
          echo ""
          echo "=== Cargo.toml first 5 lines ==="
          head -5 gateway/Cargo.toml
          echo ""
          echo "=== Building gateway ==="
          docker build --progress=plain --no-cache -t test-gw gateway/ 2>&1 || echo "BUILD EXIT CODE: $?"

      - name: Build and push control-plane
        uses: docker/build-push-action@v5
        with:
          context: control-plane
          file: control-plane/Dockerfile
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/appgate-control-plane:${{ github.ref_name }}
            ${{ env.REGISTRY }}/appgate-control-plane:latest
          push: true

      - name: Build and push gateway
        uses: docker/build-push-action@v5
        with:
          context: gateway
          file: gateway/Dockerfile
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/appgate-gateway:${{ github.ref_name }}
            ${{ env.REGISTRY }}/appgate-gateway:latest
          push: true