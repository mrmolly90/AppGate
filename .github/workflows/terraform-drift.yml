# =============================================================================
# AppGate — Terraform Drift Detection
# =============================================================================
name: Terraform Drift Detection

on:
  schedule:
    - cron: "0 6 * * *"  # Daily at 6 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  drift-detection:
    name: Drift Detection
    strategy:
      matrix:
        env: [dev, staging, production]
      fail-fast: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/environments/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false
      - name: Terraform init
        run: terraform init -input=false
      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -detailed-exitcode
        continue-on-error: true
      - name: Create drift issue
        if: steps.plan.outputs.exitcode != 0
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('/tmp/terraform-plan.txt', 'utf8');
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Drift] Terraform drift detected in ${process.env.ENV}`,
              body: `## Terraform Drift Detected\n\nEnvironment: ${process.env.ENV}\n\n\`\`\`\n${planOutput}\n\`\`\`\n\nPlease review and apply the changes.`,
              labels: ['drift', 'terraform']
            });
        env:
          ENV: ${{ matrix.env }}