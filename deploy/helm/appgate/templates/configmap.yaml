apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "appgate.fullname" . }}-control-plane
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: appgate-control-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  PORT: "{{ .Values.controlPlane.port }}"
  JWT_ISSUER: "{{ .Values.controlPlane.jwtIssuer }}"
  JWT_AUDIENCE: "{{ .Values.controlPlane.jwtAudience }}"
  LOG_LEVEL: "{{ .Values.controlPlane.logLevel }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "appgate.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: appgate-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  RUST_LOG: "{{ .Values.gateway.logLevel }}"
  CONTROL_PLANE_URL: "http://{{ include "appgate.fullname" . }}-control-plane:{{ .Values.controlPlane.port }}"