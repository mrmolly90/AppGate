apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "appgate.fullname" . }}-control-plane
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: appgate-control-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ .Values.controlPlane.replicas | default 3 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  selector:
    matchLabels:
      app.kubernetes.io/name: appgate-control-plane
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: appgate-control-plane
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: control-plane
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.controlPlane.service.metricsPort | default 9090 }}"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "appgate.fullname" . }}-control-plane
      securityContext:
        {{- toYaml .Values.controlPlane.podSecurityContext | default (dict "runAsNonRoot" true "runAsUser" 65534 "runAsGroup" 65534 "fsGroup" 65534 "seccompProfile" (dict "type" "RuntimeDefault")) | nindent 8 }}
      {{- with .Values.controlPlane.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: control-plane
          image: "{{ .Values.controlPlane.image.repository }}:{{ .Values.controlPlane.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            {{- toYaml .Values.controlPlane.securityContext | default (dict "runAsNonRoot" true "runAsUser" 65534 "runAsGroup" 65534 "readOnlyRootFilesystem" true "capabilities" (dict "drop" (list "ALL")) "seccompProfile" (dict "type" "RuntimeDefault")) | nindent 12 }}
          ports:
            - containerPort: {{ .Values.controlPlane.service.port | default 8080 }}
              name: http
              protocol: TCP
            - containerPort: {{ .Values.controlPlane.service.metricsPort | default 9090 }}
              name: metrics
              protocol: TCP
          {{- with .Values.controlPlane.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.controlPlane.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.controlPlane.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.controlPlane.resources | default (dict "requests" (dict "cpu" "500m" "memory" "512Mi") "limits" (dict "cpu" "2" "memory" "1Gi")) | nindent 12 }}
      {{- with .Values.controlPlane.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}