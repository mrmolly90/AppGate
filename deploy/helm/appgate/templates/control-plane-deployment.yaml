apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "appgate.fullname" . }}-control-plane
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: appgate-control-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.controlPlane.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: appgate-control-plane
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: appgate-control-plane
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.controlPlane.port }}"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "appgate.fullname" . }}-control-plane
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: appgate-control-plane
      containers:
        - name: control-plane
          image: "{{ .Values.controlPlane.image.repository }}:{{ .Values.controlPlane.image.tag }}"
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.controlPlane.port }}
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "appgate.fullname" . }}-control-plane
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controlPlane.databaseSecret }}
                  key: url
            - name: SIGNING_KEY_PATH
              value: /etc/appgate/keys/signing.pem
          volumeMounts:
            - name: signing-key
              mountPath: /etc/appgate/keys
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
      volumes:
        - name: signing-key
          secret:
            secretName: {{ .Values.controlPlane.signingKeySecret }}
            defaultMode: 0400