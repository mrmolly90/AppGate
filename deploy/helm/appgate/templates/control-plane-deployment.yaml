apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "appgate.fullname" . }}-control-plane
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: appgate-control-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ .Values.controlPlane.replicas | default 3 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: appgate-control-plane
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: appgate-control-plane
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: control-plane
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.controlPlane.service.metricsPort | default 9090 }}"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "appgate.fullname" . }}-control-plane
      securityContext:
        {{- toYaml .Values.controlPlane.podSecurityContext | default (dict "runAsNonRoot" true "runAsUser" 65532 "runAsGroup" 65532 "fsGroup" 65532 "seccompProfile" (dict "type" "RuntimeDefault")) | nindent 8 }}
      {{- with .Values.controlPlane.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: control-plane
          image: "{{ .Values.controlPlane.image.repository }}:{{ .Values.controlPlane.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            {{- toYaml .Values.controlPlane.securityContext | default (dict "runAsNonRoot" true "runAsUser" 65532 "runAsGroup" 65532 "readOnlyRootFilesystem" true "capabilities" (dict "drop" (list "ALL")) "seccompProfile" (dict "type" "RuntimeDefault")) | nindent 12 }}
          ports:
            - containerPort: {{ .Values.controlPlane.service.port | default 8080 }}
              name: http
              protocol: TCP
            - containerPort: {{ .Values.controlPlane.service.metricsPort | default 9090 }}
              name: metrics
              protocol: TCP
          {{- with .Values.controlPlane.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.controlPlane.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.controlPlane.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.controlPlane.probes.liveness | default (dict "httpGet" (dict "path" "/healthz" "port" 8080) "initialDelaySeconds" 10 "periodSeconds" 10) | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.controlPlane.probes.readiness | default (dict "httpGet" (dict "path" "/readyz" "port" 8080) "initialDelaySeconds" 5 "periodSeconds" 5) | nindent 12 }}
          resources:
            {{- toYaml .Values.controlPlane.resources | default (dict "requests" (dict "cpu" "250m" "memory" "256Mi") "limits" (dict "cpu" "1" "memory" "512Mi")) | nindent 12 }}
      {{- with .Values.controlPlane.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}