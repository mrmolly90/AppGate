{{- if .Values.controlPlane.statefulSet.enabled }}
# =============================================================================
# AppGate — Control Plane StatefulSet (optional, for stateful deployments)
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "appgate.fullname" . }}-control-plane
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: appgate-control-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: {{ include "appgate.fullname" . }}-control-plane
  replicas: {{ .Values.controlPlane.replicas | default 3 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: appgate-control-plane
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: appgate-control-plane
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: control-plane
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.controlPlane.service.metricsPort | default 9090 }}"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "appgate.fullname" . }}-control-plane
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.controlPlane.securityContext.runAsUser | default 65534 }}
        runAsGroup: {{ .Values.controlPlane.securityContext.runAsGroup | default 65534 }}
        fsGroup: {{ .Values.controlPlane.securityContext.fsGroup | default 65534 }}
        seccompProfile:
          type: {{ .Values.controlPlane.securityContext.seccompProfile.type | default "RuntimeDefault" }}
      containers:
        - name: control-plane
          image: "{{ .Values.controlPlane.image.repository }}:{{ .Values.controlPlane.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            runAsNonRoot: {{ .Values.controlPlane.securityContext.runAsNonRoot | default true }}
            runAsUser: {{ .Values.controlPlane.securityContext.runAsUser | default 65534 }}
            runAsGroup: {{ .Values.controlPlane.securityContext.runAsGroup | default 65534 }}
            readOnlyRootFilesystem: {{ .Values.controlPlane.securityContext.readOnlyRootFilesystem | default true }}
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            seccompProfile:
              type: {{ .Values.controlPlane.securityContext.seccompProfile.type | default "RuntimeDefault" }}
          ports:
            - containerPort: {{ .Values.controlPlane.service.port | default 8080 }}
              name: http
              protocol: TCP
            - containerPort: {{ .Values.controlPlane.service.metricsPort | default 9090 }}
              name: metrics
              protocol: TCP
          env:
            {{- toYaml .Values.controlPlane.env | nindent 12 }}
          envFrom:
            {{- toYaml .Values.controlPlane.envFrom | nindent 12 }}
          volumeMounts:
            {{- toYaml .Values.controlPlane.volumeMounts | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.controlPlane.resources | default (dict "requests" (dict "cpu" "250m" "memory" "256Mi") "limits" (dict "cpu" "1" "memory" "512Mi")) | nindent 12 }}
      volumes:
        {{- toYaml .Values.controlPlane.volumes | nindent 8 }}
{{- end }}