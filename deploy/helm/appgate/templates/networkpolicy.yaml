# =============================================================================
# AppGate — Network Policies (Default Deny + Explicit Allowlist)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "appgate.fullname" . }}-default-deny
  labels:
    {{- include "appgate.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# ── Allow control plane traffic ───────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "appgate.fullname" . }}-control-plane
  labels:
    {{- include "appgate.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: control-plane
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
      ports:
        - port: {{ .Values.controlPlane.service.port }}
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: appgate-observability
      ports:
        - port: {{ .Values.controlPlane.service.metricsPort | default 9090 }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: appgate-observability
      ports:
        - port: 4317
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
      ports:
        - port: {{ .Values.gateway.service.targetPort | default 8443 }}
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# ── Allow gateway traffic ─────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "appgate.fullname" . }}-gateway
  labels:
    {{- include "appgate.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: {{ .Values.gateway.service.targetPort | default 8443 }}
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: appgate-observability
      ports:
        - port: {{ .Values.gateway.service.metricsPort | default 9090 }}
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: control-plane
      ports:
        - port: {{ .Values.controlPlane.service.port }}
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: appgate-observability
      ports:
        - port: 4317
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # EXPLICIT LLM PROVIDER ALLOWLIST — Update with actual provider CIDRs
    - to:
        - ipBlock:
            cidr: 104.18.0.0/16  # Cloudflare / OpenAI
        - ipBlock:
            cidr: 52.0.0.0/8     # AWS / Anthropic
        - ipBlock:
            cidr: 13.107.0.0/16  # Azure OpenAI
      ports:
        - port: 443
          protocol: TCP