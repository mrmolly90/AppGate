apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "appgate.fullname" . }}-control-plane
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: appgate-control-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  minAvailable: {{ .Values.controlPlane.pdb.minAvailable | default 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: appgate-control-plane
      app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "appgate.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: appgate-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  minAvailable: {{ .Values.gateway.pdb.minAvailable | default 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: appgate-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}