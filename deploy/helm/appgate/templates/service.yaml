apiVersion: v1
kind: Service
metadata:
  name: {{ include "appgate.fullname" . }}-control-plane
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: appgate-control-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: control-plane
spec:
  type: {{ .Values.controlPlane.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.controlPlane.service.port | default 8080 }}
      targetPort: http
      name: http
    - port: {{ .Values.controlPlane.service.metricsPort | default 9090 }}
      targetPort: metrics
      name: metrics
  selector:
    app.kubernetes.io/name: appgate-control-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "appgate.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: appgate-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gateway
  annotations:
    {{- toYaml .Values.gateway.service.annotations | default (dict) | nindent 4 }}
spec:
  type: {{ .Values.gateway.service.type | default "LoadBalancer" }}
  ports:
    - port: {{ .Values.gateway.service.port | default 443 }}
      targetPort: {{ .Values.gateway.service.targetPort | default 8443 }}
      name: https
    - port: {{ .Values.gateway.service.metricsPort | default 9090 }}
      targetPort: metrics
      name: metrics
  selector:
    app.kubernetes.io/name: appgate-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}