apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "appgate.fullname" . }}-control-plane
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: appgate-control-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "appgate.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: appgate-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}