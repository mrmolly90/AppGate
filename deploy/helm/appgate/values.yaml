# AppGate Helm Values
# Default values for production deployment
# Every .Values.x reference has a default value to prevent nil pointer errors.

# ── Global ────────────────────────────────────────────────────────
global:
  environment: "production"
  imageRegistry: ""
  imagePullSecrets: []
  labels: {}

# ── Flagger (optional) ────────────────────────────────────────────
flagger:
  enabled: false

# ── Control Plane ─────────────────────────────────────────────────
controlPlane:
  name: appgate-control-plane
  replicas: 3
  logLevel: info
  jwtIssuer: appgate-control-plane
  jwtAudience: appgate-gateway
  databaseSecret: appgate-database
  signingKeySecret: appgate-signing-key

  image:
    repository: ghcr.io/mrmolly90/appgate-control-plane
    tag: ""
    pullPolicy: IfNotPresent
    digest: ""

  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  pdb:
    enabled: true
    minAvailable: 2

  service:
    type: ClusterIP
    port: 8080
    metricsPort: 9090

  probes:
    liveness:
      httpGet:
        path: /healthz
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      httpGet:
        path: /readyz
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: control-plane

  env:
    - name: APPGATE_HTTP_PORT
      value: "8080"
    - name: APPGATE_LOG_LEVEL
      value: "info"
    - name: APPGATE_OTLP_ENDPOINT
      value: "http://otel-collector.appgate-observability:4317"

  envFrom:
    - configMapRef:
        name: appgate-control-plane-config

  volumes:
    - name: signing-key
      secret:
        secretName: appgate-control-plane-signing-key

  volumeMounts:
    - name: signing-key
      mountPath: /etc/appgate/keys
      readOnly: true

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: control-plane.appgate.local
        paths:
          - path: /
            pathType: Prefix

# ── Gateway ───────────────────────────────────────────────────────
gateway:
  name: appgate-gateway
  replicas: 3
  logLevel: appgate_gateway=info
  otelEndpoint: http://otel-collector:4317
  verifyingKeySecret: appgate-verifying-key

  image:
    repository: ghcr.io/mrmolly90/appgate-gateway
    tag: ""
    pullPolicy: IfNotPresent
    digest: ""

  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 1Gi

  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    customMetrics:
      - type: Pods
        pods:
          metric:
            name: gateway_connections_active
          target:
            type: AverageValue
            averageValue: 10000

  pdb:
    enabled: true
    minAvailable: 2

  service:
    type: LoadBalancer
    port: 443
    targetPort: 8443
    metricsPort: 9090
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb

  probes:
    liveness:
      httpGet:
        path: /healthz
        port: 8443
        scheme: HTTPS
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      httpGet:
        path: /readyz
        port: 8443
        scheme: HTTPS
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: gateway

  args:
    - --listen-addr=0.0.0.0
    - --listen-port=8443
    - --control-plane-url=http://appgate-control-plane:8080
    - --tls-cert-path=/etc/appgate/tls/cert.pem
    - --tls-key-path=/etc/appgate/tls/key.pem
    - --jwt-key-path=/etc/appgate/jwt/verify.pem
    - --otlp-endpoint=http://otel-collector.appgate-observability:4317

  env:
    - name: RUST_LOG
      value: "appgate=info,warn"
    - name: RUST_BACKTRACE
      value: "0"

  volumes:
    - name: tls
      secret:
        secretName: appgate-gateway-tls
    - name: jwt-key
      secret:
        secretName: appgate-gateway-jwt-key

  volumeMounts:
    - name: tls
      mountPath: /etc/appgate/tls
      readOnly: true
    - name: jwt-key
      mountPath: /etc/appgate/jwt
      readOnly: true

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: gateway.appgate.local
        paths:
          - path: /
            pathType: Prefix

# ── Monitoring ────────────────────────────────────────────────────
prometheus:
  enabled: true
  prometheus:
    prometheusSpec:
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false

grafana:
  enabled: true
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: appgate
          orgId: 1
          folder: AppGate
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/appgate
  dashboardsConfigMaps:
    appgate: appgate-grafana-dashboards

# ── Cert-Manager ──────────────────────────────────────────────────
certManager:
  enabled: false
  issuer:
    name: appgate-issuer
    kind: ClusterIssuer
    email: admin@appgate.local
  certificate:
    duration: 8760h
    renewBefore: 360h