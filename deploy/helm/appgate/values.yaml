# AppGate Helm Values
# Default values for production deployment

# ── Global ────────────────────────────────────────────────────────
global:
  environment: "production"

# ── Flagger (optional) ────────────────────────────────────────────
flagger:
  enabled: false

# ── Control Plane ─────────────────────────────────────────────────
controlPlane:
  name: appgate-control-plane
  port: 8443
  replicas: 3
  logLevel: info
  jwtIssuer: appgate-control-plane
  jwtAudience: appgate-gateway
  databaseSecret: appgate-database
  signingKeySecret: appgate-signing-key

  image:
    repository: ghcr.io/mrmolly90/appgate-control-plane
    tag: "latest"
    pullPolicy: IfNotPresent
    digest: ""

  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPU: 70
    targetMemory: 80

  podDisruptionBudget:
    enabled: true
    minAvailable: 2

  service:
    type: ClusterIP
    port: 8443

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: control-plane.appgate.local
        paths:
          - path: /
            pathType: Prefix

# ── Gateway ───────────────────────────────────────────────────────
gateway:
  name: appgate-gateway
  port: 8443
  servicePort: 443
  serviceType: LoadBalancer
  replicas: 3
  logLevel: appgate_gateway=info
  otelEndpoint: http://otel-collector:4317
  verifyingKeySecret: appgate-verifying-key

  image:
    repository: ghcr.io/mrmolly90/appgate-gateway
    tag: "latest"
    pullPolicy: IfNotPresent
    digest: ""

  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 1Gi

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPU: 70
    targetMemory: 80

  podDisruptionBudget:
    enabled: true
    minAvailable: 2

  service:
    type: LoadBalancer
    port: 443

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: gateway.appgate.local
        paths:
          - path: /
            pathType: Prefix

# ── Monitoring ────────────────────────────────────────────────────
prometheus:
  enabled: true
  prometheus:
    prometheusSpec:
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      additionalRules:
        - groups:
            - name: appgate-slos
              interval: 30s
              rules: []

grafana:
  enabled: true
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: appgate
          orgId: 1
          folder: AppGate
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/appgate
  dashboardsConfigMaps:
    appgate: appgate-grafana-dashboards

# ── Cert-Manager ──────────────────────────────────────────────────
certManager:
  enabled: false
  issuer:
    name: appgate-issuer
    kind: ClusterIssuer
    email: admin@appgate.local