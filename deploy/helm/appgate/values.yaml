# AppGate Helm Chart — Default Values
# =============================================================================
# Override per environment in values-dev.yaml, values-staging.yaml, values-production.yaml
# =============================================================================

# ── Global Settings ────────────────────────────────────────────────────────────
global:
  environment: production
  imagePullPolicy: Always
  imageRegistry: ghcr.io/mrmolly90

# ── Control Plane ─────────────────────────────────────────────────────────────
controlPlane:
  name: appgate-control-plane
  statefulSet:
    enabled: false
  image:
    repository: ghcr.io/mrmolly90/appgate-control-plane
    tag: latest
  replicas: 3
  service:
    type: ClusterIP
    port: 8080
    metricsPort: 9090
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 1000m
  env:
    - name: APPGATE_LOG_LEVEL
      value: info
    - name: APPGATE_LOG_FORMAT
      value: json
    - name: APPGATE_SERVER_PORT
      value: "8080"
    - name: APPGATE_METRICS_PORT
      value: "9090"
    - name: APPGATE_GRPC_ADDR
      value: ":9091"

# ── Gateway ───────────────────────────────────────────────────────────────────
gateway:
  name: appgate-gateway
  image:
    repository: ghcr.io/mrmolly90/appgate-gateway
    tag: latest
  replicas: 3
  service:
    type: LoadBalancer
    port: 443
    targetPort: 8080
    metricsPort: 9090
    annotations: {}
  resources:
    requests:
      memory: 256Mi
      cpu: 500m
    limits:
      memory: 1Gi
      cpu: 2000m
  env:
    - name: RUST_LOG
      value: appgate=info,warn
    - name: APPGATE_BIND_ADDR
      value: "0.0.0.0"
    - name: APPGATE_PORT
      value: "8080"
    - name: APPGATE_CONTROL_PLANE_URL
      value: "http://appgate-control-plane:8080"
    - name: APPGATE_LOG_LEVEL
      value: info
    - name: APPGATE_RATE_LIMIT_ENABLED
      value: "true"
    - name: APPGATE_RATE_LIMIT_REQUESTS_PER_SECOND
      value: "10000"
    - name: APPGATE_RATE_LIMIT_BURST_SIZE
      value: "20000"
    - name: APPGATE_ENVIRONMENT
      value: production

# ── Database ──────────────────────────────────────────────────────────────────
postgresql:
  enabled: true
  image: postgres:15-alpine
  storage: 10Gi
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 1000m

redis:
  enabled: true
  image: redis:7-alpine
  storage: 5Gi

# ── Monitoring ────────────────────────────────────────────────────────────────
monitoring:
  prometheus:
    enabled: true
  grafana:
    enabled: true
    adminPassword: ""
  otel:
    enabled: true

# ── Certificates ──────────────────────────────────────────────────────────────
certManager:
  enabled: false
  issuer:
    name: appgate-issuer
    kind: ClusterIssuer

# ── Canary / Flagger ─────────────────────────────────────────────────────────
flagger:
  enabled: false