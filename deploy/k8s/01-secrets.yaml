# WARNING: Do NOT commit this file with real values.
# Use: kubectl create secret generic appgate-secrets --from-literal=...
# Or integrate with External Secrets Operator + Vault
apiVersion: v1
kind: Secret
metadata:
  name: appgate-secrets
  namespace: appgate-system
type: Opaque
stringData:
  # PostgreSQL DSN
  pg-dsn: "postgres://appgate:CHANGEME@appgate-postgresql:5432/appgate?sslmode=require"
  
  # Redis password (if AUTH enabled)
  redis-password: "CHANGEME"
  
  # JWT RS256 public key for token validation
  jwt-public-key: |
    -----BEGIN PUBLIC KEY-----
    CHANGEME_PASTE_YOUR_RS256_PUBLIC_KEY_HERE
    -----END PUBLIC KEY-----
  
  # Upstream LLM API keys (gateway holds these, NOT apps)
  openai-api-key: "sk-CHANGEME"
  anthropic-api-key: "sk-ant-CHANGEME"
  azure-openai-key: "CHANGEME"
  
  # etcd auth
  etcd-password: "CHANGEME"
