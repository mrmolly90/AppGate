# deploy/k8s/01-secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: appgate-secrets
  namespace: appgate-system
type: Opaque
stringData:
  # NEVER commit real values. Inject via CI/CD or external-secrets.
  # These placeholders MUST be replaced by your CI/CD pipeline or external-secrets operator.
  pg-dsn: "postgres://appgate:${PGPASSWORD}@appgate-postgres:5432/appgate?sslmode=require"
  pg-password: "${PGPASSWORD}"
  redis-password: "${REDIS_PASSWORD}"
  jwt-secret: "${JWT_SECRET}"
  jwt-public-key: "${JWT_PUBLIC_KEY}"
  openai-api-key: "${OPENAI_API_KEY}"
  anthropic-api-key: "${ANTHROPIC_API_KEY}"
  etcd-password: "${ETCD_PASSWORD}"