apiVersion: v1
kind: Secret
metadata:
  name: appgate-secrets
  namespace: appgate-system
type: Opaque
stringData:
  pg-dsn: "postgres://appgate:changeme-strong-password@appgate-postgres:5432/appgate?sslmode=disable"
  pg-password: "changeme-strong-password"
  redis-password: "changeme-redis-password"
  redis-url: "redis://appgate-redis:6379"
  jwt-public-key: |
    -----BEGIN PUBLIC KEY-----
    YOUR_ACTUAL_KEY_HERE
    -----END PUBLIC KEY-----
  openai-api-key: "sk-or-REPLACE_ME_IN_PRODUCTION"
  anthropic-api-key: "sk-ant-REPLACE-ME"
  etcd-password: "changeme-etcd-password"