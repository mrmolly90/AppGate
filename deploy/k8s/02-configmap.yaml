apiVersion: v1
kind: ConfigMap
metadata:
  name: appgate-config
  namespace: appgate-system
data:
  APPGATE_LOG_LEVEL: "info"
  APPGATE_LOG_FORMAT: "json"
  APPGATE_SERVER_PORT: "8080"
  APPGATE_METRICS_PORT: "9090"
  APPGATE_READ_TIMEOUT: "30s"
  APPGATE_WRITE_TIMEOUT: "60s"
  APPGATE_MAX_BODY_SIZE: "10485760"  # 10MB
  APPGATE_REDIS_ADDR: "appgate-redis-master:6379"
  APPGATE_REDIS_DB: "0"
  APPGATE_PG_POOL_SIZE: "10"
  APPGATE_ETCD_ENDPOINTS: "appgate-etcd:2379"
  APPGATE_ETCD_DIAL_TIMEOUT: "5s"
  APPGATE_RATE_LIMIT_RPS: "100"
  APPGATE_RATE_LIMIT_BURST: "150"
  APPGATE_RATE_LIMIT_WINDOW: "1m"
  APPGATE_TOKEN_BUDGET_ENABLED: "true"
  APPGATE_DEFAULT_TOKEN_QUOTA: "100000"  # per project per day
  APPGATE_PROMPT_INJECTION_ENABLED: "true"
  APPGATE_PROMPT_INJECTION_THRESHOLD: "0.7"
  APPGATE_PII_DETECTION_ENABLED: "true"
  APPGATE_PII_REDACTION_MODE: "mask"  # mask | block | log
  APPGATE_AUDIT_RETENTION_DAYS: "90"
  APPGATE_UPSTREAM_TIMEOUT: "30s"
  APPGATE_UPSTREAM_MAX_RETRIES: "3"
  APPGATE_MODEL_ROUTING_ENABLED: "true"
  APPGATE_FALLBACK_ENABLED: "true"
apiVersion: v1
kind: ConfigMap
metadata:
  name: appgate-config
  namespace: appgate-system
data:
  pg-dsn: "postgres://appgate:changeme-strong-password@appgate-postgres:5432/appgate?sslmode=disable"
  redis-url: "redis://appgate-redis:6379"
  control-plane-url: "http://appgate-control-plane:8080"
  # keep your other existing keys