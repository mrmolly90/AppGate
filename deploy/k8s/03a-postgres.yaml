apiVersion: apps/v1
kind: Deployment
metadata:
  name: appgate-postgres
  namespace: appgate-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appgate-postgres
  template:
    metadata:
      labels:
        app: appgate-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "appgate"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: appgate-secrets
              key: pg-password
        - name: POSTGRES_DB
          value: "appgate"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: postgres-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: appgate-postgres
  namespace: appgate-system
spec:
  selector:
    app: appgate-postgres
  ports:
  - port: 5432
    targetPort: 5432