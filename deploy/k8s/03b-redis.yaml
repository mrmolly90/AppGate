apiVersion: apps/v1
kind: Deployment
metadata:
  name: appgate-redis
  namespace: appgate-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appgate-redis
  template:
    metadata:
      labels:
        app: appgate-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        command: ["redis-server"]
        args: ["--requirepass", "$(REDIS_PASSWORD)"]
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: appgate-secrets
              key: redis-password
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: appgate-redis
  namespace: appgate-system
spec:
  selector:
    app: appgate-redis
  ports:
  - port: 6379
    targetPort: 6379