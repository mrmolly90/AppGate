# deploy/k8s/03c-gateway.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appgate-gateway
  namespace: appgate-system
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: appgate-gateway
  template:
    metadata:
      labels:
        app: appgate-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: appgate
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [appgate-gateway]
                topologyKey: kubernetes.io/hostname
      containers:
        - name: gateway
          image: ghcr.io/mrmolly90/appgate-gateway:v0.3.3
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: grpc
          env:
            - name: APPGATE_BIND_ADDR
              value: "0.0.0.0"
            - name: APPGATE_PORT
              value: "8080"
            - name: APPGATE_CONTROL_PLANE_URL
              value: "http://appgate-control-plane:8080"
            - name: APPGATE_UPSTREAM_DEFAULT_URL
              value: ""
            - name: APPGATE_RATE_LIMIT_ENABLED
              value: "true"
            - name: APPGATE_RATE_LIMIT_RPS
              value: "100"
            - name: APPGATE_CACHE_ENABLED
              value: "true"
            - name: APPGATE_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: appgate-secrets
                  key: redis-url
            - name: RUST_LOG
              value: "appgate=info"
            - name: APPGATE_TLS_ENABLED
              value: "false"
            - name: APPGATE_ENVIRONMENT
              value: "production"
          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "2000m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 100Mi