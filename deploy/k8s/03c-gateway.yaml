apiVersion: apps/v1
kind: Deployment
metadata:
  name: appgate-gateway
  namespace: appgate-system
  labels:
    app: appgate-gateway
    version: v0.3.2
spec:
  replicas: 3
  selector:
    matchLabels:
      app: appgate-gateway
  template:
    metadata:
      labels:
        app: appgate-gateway
        version: v0.3.2
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: appgate
      containers:
      - name: gateway
        image: ghcr.io/mrmolly90/appgate-gateway:v0.3.2
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        - name: metrics
          containerPort: 9090
        envFrom:
        - configMapRef:
            name: appgate-config
        env:
        - name: APPGATE_CONTROL_PLANE_URL
          value: "http://appgate-control-plane:8080"
        - name: APPGATE_REDIS_URL
          value: "redis://appgate-redis:6379"
        - name: APPGATE_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: appgate-secrets
              key: redis-password
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: appgate-gateway
  namespace: appgate-system
spec:
  selector:
    app: appgate-gateway
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: metrics
    port: 9090
    targetPort: 9090
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: appgate-gateway
  namespace: appgate-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: appgate-gateway