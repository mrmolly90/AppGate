apiVersion: apps/v1
kind: Deployment
metadata:
  name: appgate-etcd
  namespace: appgate-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appgate-etcd
  template:
    metadata:
      labels:
        app: appgate-etcd
    spec:
      containers:
      - name: etcd
        image: quay.io/coreos/etcd:v3.5.15
        ports:
        - containerPort: 2379
          name: client
        - containerPort: 2380
          name: peer
        command:
        - etcd
        - --listen-client-urls=http://0.0.0.0:2379
        - --advertise-client-urls=http://appgate-etcd:2379
        - --listen-peer-urls=http://0.0.0.0:2380
        - --initial-advertise-peer-urls=http://appgate-etcd:2380
        - --initial-cluster=default=http://appgate-etcd:2380
        - --initial-cluster-token=appgate-etcd
        - --initial-cluster-state=new
        - --data-dir=/var/lib/etcd
        volumeMounts:
        - name: etcd-data
          mountPath: /var/lib/etcd
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: etcd-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: appgate-etcd
  namespace: appgate-system
spec:
  selector:
    app: appgate-etcd
  ports:
  - port: 2379
    targetPort: 2379
    name: client
  - port: 2380
    targetPort: 2380
    name: peer