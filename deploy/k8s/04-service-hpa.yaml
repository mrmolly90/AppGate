apiVersion: v1
kind: Service
metadata:
  name: appgate-control-plane
  namespace: appgate-system
spec:
  selector:
    app: appgate-control-plane
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: metrics
      port: 9090
      targetPort: 9090
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: appgate-control-plane
  namespace: appgate-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: appgate-control-plane
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: appgate-control-plane
  namespace: appgate-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: appgate-control-plane
