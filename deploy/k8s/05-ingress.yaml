apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: appgate
  namespace: appgate-system
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-AppGate-Project, X-AppGate-User, X-Request-ID"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - appgate.yourdomain.com
      secretName: appgate-tls
  rules:
    - host: appgate.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: appgate-control-plane
                port:
                  number: 80
