apiVersion: v1
kind: ServiceAccount
metadata:
  name: appgate
  namespace: appgate-system
  annotations:
    eks.amazonaws.com/role-arn: ""
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: appgate
  namespace: appgate-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["appgate-secrets"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: appgate
  namespace: appgate-system
subjects:
  - kind: ServiceAccount
    name: appgate
    namespace: appgate-system
roleRef:
  kind: Role
  name: appgate
  apiGroup: rbac.authorization.k8s.io
