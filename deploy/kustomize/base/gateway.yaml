apiVersion: apps/v1
kind: Deployment
metadata:
  name: appgate-gateway
  namespace: appgate-gateway
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0  # Zero-downtime for security gateway
      maxSurge: 2
  selector:
    matchLabels:
      app: appgate-gateway
  template:
    metadata:
      labels:
        app: appgate-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: appgate-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532  # Match distroless nonroot
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/mrmolly90/appgate-gateway:v0.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "appgate=info,warn"
            - name: RUST_BACKTRACE
              value: "0"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.appgate-observability:4317"
          args:
            - --listen-addr=0.0.0.0
            - --listen-port=8443
            - --control-plane-url=http://appgate-control-plane.appgate-system:8080
            - --tls-cert-path=/etc/appgate/tls/cert.pem
            - --tls-key-path=/etc/appgate/tls/key.pem
            - --jwt-key-path=/etc/appgate/jwt/verify.pem
            - --worker-threads=0
            - --max-body-size=10485760
            - --upstream-timeout-secs=300
            - --max-concurrent-requests=10000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "1000m"
              memory: "512Mi"
            limits:
              cpu: "4000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5