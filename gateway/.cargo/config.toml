# Cross-compilation linker configuration for musl targets
# This enables native cross-compilation without QEMU emulation.
# Install cross-linkers: `brew install FiloSottile/musl-cross/musl-cross` (macOS)
# or `apt install musl-tools gcc-aarch64-linux-gnu` (Linux)

[target.x86_64-unknown-linux-musl]
linker = "x86_64-linux-musl-gcc"

[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-musl-gcc"