[package]
name = "appgate-gateway"
version = "1.0.0"
edition = "2021"
authors = ["AppGate Security Team <security@appgate.local>"]
description = "AppGate centralized proxy gateway for multi-LLM traffic"
repository = "https://github.com/mrmolly90/appgate"
license = "MIT"
rust-version = "1.80"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
axum = { version = "0.7", features = ["http2", "macros", "ws"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["compression-gzip", "trace", "cors", "limit", "timeout"] }
reqwest = { version = "0.12", features = ["http2", "json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = "9.3"
rustls = "0.23"
rustls-pemfile = "2.1"
tokio-rustls = "0.26"
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.23"
opentelemetry = "0.22"
opentelemetry-otlp = { version = "0.15", features = ["tonic"] }
opentelemetry_sdk = { version = "0.22", features = ["rt-tokio"] }
moka = { version = "0.12", features = ["future"] }
dashmap = "6.0"
bytes = "1.5"
uuid = { version = "1.7", features = ["v4", "serde"] }
regex = "1.10"
url = "2.5"
anyhow = "1.0"
once_cell = "1.19"
envy = "0.4"
blake3 = "1.5"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
http = "1.1"
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
panic = "abort"