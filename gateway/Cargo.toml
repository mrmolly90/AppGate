[package]
name = "appgate-gateway"
version = "0.1.0"
edition = "2021"
description = "High-performance LLM security gateway"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.28"
opentelemetry = { version = "0.27", features = ["metrics", "trace"] }
opentelemetry-sdk = { version = "0.27", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
arc-swap = "1"
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
governor = "0.7"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id"] }
hickory-resolver = "0.24"
parking_lot = "0.12"
url = "2"
once_cell = "1"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3