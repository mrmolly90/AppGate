[package]
name = "appgate-gateway"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Zero-trust LLM security gateway"

[dependencies]
# Async Runtime
tokio = { version = "1.40", features = ["full"] }

# HTTP Server
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"

# HTTP Client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "http2"], default-features = false }

# TLS
tokio-rustls = "0.26"
rustls-pemfile = "2.2"
rustls-pki-types = "1.10"
rustls = "0.23"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI & Config
clap = { version = "4.5", features = ["derive"] }

# Error Handling
anyhow = "1.0"
thiserror = "2.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Metrics
prometheus = "0.14"

# Caching
moka = { version = "0.12", features = ["future"] }

# Rate Limiting
governor = "0.7"

# Utilities
bytes = "1.8"
uuid = { version = "1.11", features = ["v4", "serde"] }
once_cell = "1.20"
arc-swap = "1.7"
chrono = { version = "0.4", features = ["serde"] }

# URL Parsing
url = "2.5"

# Redis (for distributed rate limiting)
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# gRPC / Protobuf
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"

# Compression
flate2 = "1.0"
zstd = "0.13"

# Cryptography
blake3 = "1.5"
sha2 = "0.10"
hmac = "0.12"
jsonwebtoken = "9.3"

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.5", features = ["async_tokio"] }
mockall = "0.13"
wiremock = "0.6"

[features]
default = ["jwt-auth", "ratelimit", "ssrf-protection", "policy-engine", "audit"]
jwt-auth = []
ratelimit = []
ssrf-protection = []
policy-engine = []
audit = []

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3