[package]
name = "appgate-gateway"
version = "0.3.0"
edition = "2021"
rust-version = "1.80"

[features]
default = ["full"]
full = ["tls", "otel", "metrics", "ratelimit", "policy-engine", "ssrf-protection", "audit", "jwt-auth"]
tls = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile"]
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]
metrics = ["dep:prometheus"]
ratelimit = ["dep:governor", "dep:moka"]
policy-engine = []
ssrf-protection = []
audit = ["dep:tokio-util"]
jwt-auth = ["dep:jsonwebtoken"]

[dependencies]
tokio-stream = { version = "0.1", features = ["sync"] }
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1.5"
once_cell = "1"
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["http2", "macros", "tracing"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower = { version = "0.5", features = ["limit", "load-shed", "timeout"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "limit", "compression-full", "cors", "request-id", "auth"] }
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["client", "http2", "tokio"] }
http-body-util = "0.1"
bytes = "1.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = { version = "9", optional = true }
governor = { version = "0.7", optional = true }
moka = { version = "0.12", features = ["future"], optional = true }  # For distributed rate limit caching
rustls = { version = "0.23", optional = true, features = ["ring", "tls12"] }
tokio-rustls = { version = "0.26", optional = true }
rustls-pemfile = { version = "2", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = { version = "0.28", optional = true }
opentelemetry = { version = "0.28", optional = true }
opentelemetry_sdk = { version = "0.28", optional = true, features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.28", optional = true, features = ["grpc-tonic"] }
prometheus = { version = "0.14", optional = true }
dashmap = "6"
parking_lot = "0.12"
arc-swap = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
hickory-resolver = "0.24"
url = "2"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "http2", "stream", "rustls-tls"], default-features = false }
tokio-util = { version = "0.7", optional = true, features = ["codec"] }
futures = "0.3"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
panic = "abort"
