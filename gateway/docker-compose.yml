services:
  gateway:
    image: ghcr.io/mrmolly90/appgate-gateway:v0.3.3
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8443:8443"
    volumes:
      - ./certs/tls:/etc/appgate/tls:ro
      - ./certs/jwt:/etc/appgate/jwt:ro
    command:
      - "/usr/local/bin/appgate-gateway"
      - "--listen-addr=0.0.0.0"
      - "--listen-port=8443"
      - "--tls-cert-path=/etc/appgate/tls/cert.pem"
      - "--tls-key-path=/etc/appgate/tls/key.pem"
      - "--jwt-key-path=/etc/appgate/jwt/verify.pem"
      - "--control-plane-url=http://control-plane:9090"
      - "--otlp-endpoint=http://otel-collector:4317"
    restart: unless-stopped

    # ── Resource Limits ─────────────────────────────────────────────────────
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 128M

    # ── Security ────────────────────────────────────────────────────────────
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

    # ── Health Check ────────────────────────────────────────────────────────
    healthcheck:
      test: ["CMD", "pgrep", "-f", "appgate-gateway"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

    # ── Logging ─────────────────────────────────────────────────────────────
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"

    # ── Environment ─────────────────────────────────────────────────────────
    environment:
      - RUST_LOG=appgate=info,warn
      - RUST_BACKTRACE=1