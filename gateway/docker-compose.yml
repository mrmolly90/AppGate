# =============================================================================
# AppGate Gateway — Standalone Development Stack
# =============================================================================
# Note: For the full production stack, use docker-compose.yml at the project root.
# This file runs only the gateway + Redis for local testing.
# =============================================================================

services:
  redis:
    image: redis:7-alpine
    container_name: appgate-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: appgate-gateway-dev
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "9092:9090"
    environment:
      APPGATE_BIND_ADDR: 0.0.0.0
      APPGATE_PORT: 8080
      APPGATE_METRICS_PORT: 9090
      APPGATE_CONTROL_PLANE_URL: http://host.docker.internal:8080
      APPGATE_REDIS_URL: redis://redis:6379/0
      APPGATE_TLS_ENABLED: "false"
      APPGATE_JWT_ENABLED: "false"
      APPGATE_LOG_LEVEL: debug
      APPGATE_ENVIRONMENT: development
      APPGATE_RATE_LIMIT_ENABLED: "true"
      APPGATE_RATE_LIMIT_RPS: "100"
      APPGATE_CACHE_ENABLED: "true"
      APPGATE_CACHE_TTL_SECS: "60"
      APPGATE_CIRCUIT_BREAKER_FAILURE_THRESHOLD: "5"
      APPGATE_CIRCUIT_BREAKER_RECOVERY_TIMEOUT_MS: "30000"
      APPGATE_UPSTREAM_DEFAULT_URL: ""
      APPGATE_UPSTREAM_CONNECT_TIMEOUT_MS: "5000"
      APPGATE_UPSTREAM_READ_TIMEOUT_MS: "60000"
      APPGATE_APPROVED_DOMAINS: api.openai.com,api.anthropic.com
      RUST_LOG: debug,appgate=debug
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  redis_dev_data: