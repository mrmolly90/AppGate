# Default-deny network policy for all namespaces
# Any namespace without explicit allow rules is completely isolated
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny
spec:
  description: "Default deny all ingress and egress traffic"
  endpointSelector:
    matchLabels: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            "reserved:init": ""
      toPorts:
        - ports:
            - port: "0"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "reserved:init": ""
      toPorts:
        - ports:
            - port: "0"
              protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: appgate-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: appgate-gateway
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: appgate-observability
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress