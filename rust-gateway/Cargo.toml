[workspace]
resolver = "2"
members = ["."]

[package]
name = "appgate-gateway"
version = "0.2.0"
edition = "2021"
description = "AppGate SDP Gateway — High-performance async Rust zero-trust security gateway"
authors = ["AppGate Team"]
license = "Apache-2.0"
repository = "https://github.com/mrmolly90/AppGate"
rust-version = "1.80"

# =============================================================================
# Feature Flags — Compile-time component selection
# =============================================================================
# All features are additive. Default enables the full gateway.
# Use --no-default-features for minimal builds (e.g., embedded/edge gateways).
#
# Performance rationale:
# - Feature flags allow stripping unused code at compile time
# - Reduces binary size and attack surface for specialized deployments
# - Enables musl builds under 8MB for edge gateways
# =============================================================================
[features]
default = ["full"]
full = [
    "tls",
    "otel",
    "metrics",
    "ratelimit",
    "policy-engine",
    "ssrf-protection",
    "audit",
    "jwt-auth",
    "connection-pooling"
]
# Core protocol support
tls = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile"]
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]
metrics = ["dep:prometheus"]
ratelimit = ["dep:governor"]
policy-engine = []
ssrf-protection = []
audit = []
jwt-auth = ["dep:jsonwebtoken", "dep:rsa"]
connection-pooling = ["dep:deadpool"]
# Minimal edge gateway — no TLS termination, no OTel, no rate limiting
minimal = []

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
# ── Async Runtime ─────────────────────────────────────────────────
# tokio with io-uring and multi-thread scheduler for 1M+ connections
tokio = { version = "1.40", features = [
    "full",
    "net",
    "rt-multi-thread",
    "sync",
    "signal",
    "process",
    "tracing"
] }

# ── HTTP / Proxy ──────────────────────────────────────────────────
# hyper 1.x with full HTTP/1.1 and HTTP/2 support
hyper = { version = "1.5", features = [
    "server",
    "client",
    
] }
hyper-util = { version = "0.1", features = [
    "server",
    "client",
    "tokio"
] }
http-body-util = "0.1"
bytes = "1.7"        # Zero-copy buffer management

# ── TLS (rustls — no OpenSSL) ─────────────────────────────────────
rustls = { version = "0.23", optional = true, features = [
    "ring",
    "tls12"
] }
tokio-rustls = { version = "0.26", optional = true }
rustls-pemfile = { version = "2", optional = true }

# ── Serialization ─────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── JWT Auth ──────────────────────────────────────────────────────
jsonwebtoken = { version = "9", optional = true }
rsa = { version = "0.9", optional = true }

# ── Rate Limiting ─────────────────────────────────────────────────
governor = { version = "0.7", optional = true }

# ── Connection Pooling ────────────────────────────────────────────
deadpool = { version = "0.12", optional = true }

# ── Observability ─────────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "json",
    "registry"
] }
tracing-opentelemetry = { version = "0.28", optional = true }
opentelemetry = { version = "0.28", optional = true, features = [
    "metrics",
    "trace"
] }
opentelemetry_sdk = { version = "0.28", optional = true, features = [
    "rt-tokio",
    "metrics"
] }
opentelemetry-otlp = { version = "0.28", optional = true, features = [
    "grpc-tonic"
] }
prometheus = { version = "0.14", optional = true }

# ── Concurrency ───────────────────────────────────────────────────
dashmap = "6"        # Lock-free concurrent hashmap
parking_lot = "0.12" # Faster mutex than std::sync::Mutex
arc-swap = "1"       # Lock-free atomic pointer swap for hot config reload

# ── CLI & Config ──────────────────────────────────────────────────
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"

# ── Networking ────────────────────────────────────────────────────
hickory-resolver = "0.24"  # DNS resolver (formerly trust-dns)
url = "2"

# ── Utilities ─────────────────────────────────────────────────────
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

[profile.release]
# Performance-optimized release profile
lto = "fat"           # Full link-time optimization across crate boundaries
codegen-units = 1     # Single codegen unit for maximum optimization
opt-level = 3         # Aggressive optimization
strip = "symbols"     # Strip debug symbols for smaller binary
panic = "abort"       # Abort on panic (smaller binary, no unwind tables)

[profile.release.build-override]
# Build scripts don't need optimization
opt-level = 0
codegen-units = 16

[profile.bench]
# Benchmark profile — keep debug symbols for profiling
debug = 1
opt-level = 3
lto = "fat"
codegen-units = 1

[[bench]]
name = "throughput"
harness = false


